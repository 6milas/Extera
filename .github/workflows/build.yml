name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK, NDK, CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Create signing key
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -storepass startpass123 -keypass startpass123 \
            -alias startkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Start, OU=Dev, O=Dev, C=RU"
          mkdir -p ~/.gradle
          {
            echo "RELEASE_STORE_PASSWORD=startpass123"
            echo "RELEASE_KEY_ALIAS=startkey"
            echo "RELEASE_KEY_PASSWORD=startpass123"
          } >> ~/.gradle/gradle.properties

      - name: Create stub google-services.json
        run: |
          PKG=$(grep -E '^APP_PACKAGE=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "Package: $PKG"
          client() {
            cat <<JSON
              {
                "client_info": {
                  "mobilesdk_app_id": "1:111111111111:android:0000000000000000000000",
                  "android_client_info": { "package_name": "$1" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyDummyDummyDummyDummyDummyDum" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
          JSON
          }
          {
            echo '{'
            echo '  "project_info": { "project_number": "111111111111", "project_id": "stub-project", "storage_bucket": "stub-project.appspot.com" },'
            echo '  "client": ['
            client "$PKG"; echo ','
            client "$PKG.beta"; echo ','
            client "$PKG.web"
            echo '  ],'
            echo '  "configuration_version": "1"'
            echo '}'
          } > TMessagesProj_App/google-services.json

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          
